<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Cita - Barbería Cuba</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav container">
            <a href="index.html" class="logo">BARBERÍA</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Inicio</a></li>
                <li><a href="services.html" class="nav-link">Servicios</a></li>
                <li><a href="booking.html" class="nav-link active">Reservar</a></li>
                <li><a href="admin.html" class="nav-link admin-btn">Admin</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <section class="section container">
        <h1 class="page-title">Reserva tu Cita</h1>
        <div class="booking-container">
            <form id="booking-form" class="booking-form">
                <div class="form-group">
                    <label for="name">Nombre completo</label>
                    <input type="text" id="name" name="name" required placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label for="service">Servicio</label>
                    <select id="service" name="service" required>
                        <option value="">Selecciona un servicio</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="barber">Barbero (opcional)</label>
                    <select id="barber" name="barber">
                        <option value="">Cualquier barbero disponible</option>
                        <option value="Carlos">Carlos</option>
                        <option value="Miguel">Miguel</option>
                        <option value="José">José</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Fecha</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="form-group">
                    <label for="time">Hora</label>
                    <input type="time" id="time" name="time" required>
                </div>
                <div class="form-group">
                    <label for="notes">Notas adicionales (opcional)</label>
                    <textarea id="notes" name="notes" rows="3" placeholder="Alguna indicación especial..."></textarea>
                </div>
                
                <div class="form-summary">
                    <h3>Resumen de la cita</h3>
                    <p><strong>Servicio:</strong> <span id="summary-service">-</span></p>
                    <p><strong>Precio:</strong> <span id="summary-price">-</span> CUP</p>
                    <p><strong>Duración:</strong> <span id="summary-duration">-</span> min</p>
                </div>
                
                <button type="submit" class="btn btn-primary btn-whatsapp">
                    <span class="whatsapp-icon">📱</span> Enviar por WhatsApp
                </button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Barbería Cuba. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="booking.js"></script>
</body>
</html>
